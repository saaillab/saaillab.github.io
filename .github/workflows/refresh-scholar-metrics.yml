name: Refresh Google Scholar Metrics

on:
  schedule:
    # Weekly on Mondays at 04:00 UTC (07:00 EAT)
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-metrics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Google Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/refresh_scholar_metrics.py

      - name: Commit updated scholar metrics if changed
        run: |
          if ! git diff --quiet src/data/scholar-metrics.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/scholar-metrics.json
            git commit -m "data: sync weekly Google Scholar citation metrics"
            git push
          else
            echo "No changes to scholar-metrics.json."
          fi
