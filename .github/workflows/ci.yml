name: Verify SAAIL Lab Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type-check Astro project
        run: npx tsc --noEmit --skipLibCheck

      - name: Build static site
        run: npm run build

      - name: Run site verification & WCAG static checks
        run: python scripts/verify_site.py

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: saail-dist
          path: dist/

  lighthouse-a11y:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download built dist artifact
        uses: actions/download-artifact@v4
        with:
          name: saail-dist
          path: dist/

      - name: Audit Accessibility and SEO via Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: false
          configPath: .lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
